services:
  - type: web
    name: paperclip
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # --- AI ---------------------------------------------------------------
      # Leave unset to run in MOCK MODE (demoable with no key). Set a real key
      # in the Render dashboard to use the live Anthropic API.
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- Optional: Semantic Scholar (higher rate limits for enrichment) ---
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false

      # Render injects PORT automatically; the server honors process.env.PORT.
